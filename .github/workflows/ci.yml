name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  # Forge artifact cache saves. The workflow still cannot push or tag.
  actions: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 18-decimal multi-market
            match: MultiMarketBook18Invariant
            exclude: ""
          - name: 6-decimal multi-market
            match: MultiMarketBook6Invariant
            exclude: ""
          - name: remaining suites
            match: ""
            exclude: "MultiMarketBook18Invariant|MultiMarketBook6Invariant"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      # foundryup --install 1.8.1. Not `nightly`, and not `stable` (that channel moves).
      # The following step rejects any build other than the 1.8.1 release binary.
      - name: Install Foundry 1.8.1
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: "1.8.1"
          cache: true

      - name: Require the Foundry 1.8.1 release build
        run: |
          set -euo pipefail
          version="$(forge --version)"
          printf '%s\n' "$version"
          printf '%s\n' "$version" | grep -qx 'forge Version: 1.8.1'
          printf '%s\n' "$version" | grep -qx 'Commit SHA: 982849d3140c01fd3b72905759581a132df7aa98'
          if printf '%s\n' "$version" | grep -qi 'nightly'; then
            echo "Foundry nightly is not an accepted toolchain"
            exit 1
          fi

      - name: Install pnpm 10.30.1
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.30.1

      - name: Install Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Cache Forge build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            cache
            out
          key: forge-${{ runner.os }}-${{ hashFiles('foundry.toml', 'foundry.lock', '**/*.sol') }}
          restore-keys: |
            forge-${{ runner.os }}-

      - name: Build contracts
        run: forge build

      # 256 runs and depth 500, the same campaign the local instructions use.
      # The two multi-market contracts run on their own runners. Every other
      # suite runs on the third. Nothing is excluded from the union.
      - name: Test contracts
        env:
          FOUNDRY_INVARIANT_RUNS: "256"
          FOUNDRY_INVARIANT_DEPTH: "500"
          FOUNDRY_INVARIANT_FAIL_ON_REVERT: "true"
        run: |
          set -euo pipefail
          args=(--fuzz-seed 0x5d56b26)
          if [ -n "${{ matrix.match }}" ]; then
            args+=(--match-contract "${{ matrix.match }}")
          fi
          if [ -n "${{ matrix.exclude }}" ]; then
            args+=(--no-match-contract "${{ matrix.exclude }}")
          fi
          pnpm test:contracts "${args[@]}"

  client:
    name: Client and ABI
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry 1.8.1
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: "1.8.1"
          cache: true

      - name: Require the Foundry 1.8.1 release build
        run: |
          set -euo pipefail
          version="$(forge --version)"
          printf '%s\n' "$version"
          printf '%s\n' "$version" | grep -qx 'forge Version: 1.8.1'
          printf '%s\n' "$version" | grep -qx 'Commit SHA: 982849d3140c01fd3b72905759581a132df7aa98'
          if printf '%s\n' "$version" | grep -qi 'nightly'; then
            echo "Foundry nightly is not an accepted toolchain"
            exit 1
          fi

      - name: Install pnpm 10.30.1
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.30.1

      - name: Install Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Cache Forge build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            cache
            out
          key: forge-${{ runner.os }}-${{ hashFiles('foundry.toml', 'foundry.lock', '**/*.sol') }}
          restore-keys: |
            forge-${{ runner.os }}-

      - name: Build contracts
        run: forge build

      - name: Test client
        run: pnpm test:client

      - name: Fail if the ABI bundle is stale
        run: pnpm abi && git diff --exit-code
